name: VM Caddy site

# Self-hoster-specific, like the deploy job: the maintainer's VM co-hosts an
# `infra` stack whose Caddy reverse-proxies several sites, and that Caddyfile is
# not in this repo. This workflow is the only way to touch it from here (there is
# no direct SSH from the dev machine).
#
# `inspect` is read-only and safe to run any time. `add` is guarded: it backs the
# file up, validates the result with `caddy validate`, and restores the backup if
# validation fails, because the same file serves other people's sites.
#
# `add` IS A TEMPORARY PATCH, NOT A FIX. That Caddyfile is owned by the `infra`
# stack's own pipeline, which regenerates it from its own source. Every
# regeneration drops whatever this workflow appended, and `app.pulsyr.dev` then
# has no site block, so Caddy serves no certificate for it and every client
# fails the TLS handshake with alert 80 (internal error). That is what a report
# of "app.pulsyr.dev has no certificate / MCP will not connect" means; the cert
# itself is fine and DNS is fine. It happened on 2026-08-11, 08-13, 08-18 and
# 08-22, each time silently.
#
# The durable home for the block is the `infra` stack's own versioned Caddyfile,
# next to the `pulso.eduk3.cl` and `pulso.tidanalytics.com` blocks that survive
# precisely because they live there (both carry a "NO BORRAR" comment). Run `add`
# to restore service now, then move the block there so it stops vanishing.

on:
  # Self-heal every 15 minutes. This is a band-aid over someone else's pipeline
  # stomping on a shared Caddyfile, and it should be deleted the day the block
  # moves into the infra stack's own versioned file. Until then it caps the
  # outage at 15 minutes instead of however long it takes a human to notice a
  # TLS handshake failing. Cheap in steady state: when the block is already
  # present the script exits before touching, backing up or reloading anything.
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "inspect (read-only) or add (write a site block)"
        required: true
        default: inspect
        type: choice
        options: [inspect, add]
      hostname:
        description: "Hostname to serve, e.g. app.pulsyr.dev"
        required: true
        default: app.pulsyr.dev
      upstream:
        description: "Container:port to reverse-proxy to"
        required: true
        default: pulso-app-1:8000

jobs:
  caddy:
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run against the VM
        uses: appleboy/ssh-action@v1
        env:
          # A scheduled run carries no inputs, so it falls back to repairing the
          # one hostname that keeps disappearing. A manual run still decides for
          # itself, and still defaults to the read-only inspect.
          ACTION: ${{ inputs.action || 'add' }}
          HOSTNAME_IN: ${{ inputs.hostname || 'app.pulsyr.dev' }}
          UPSTREAM: ${{ inputs.upstream || 'pulso-app-1:8000' }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: ACTION,HOSTNAME_IN,UPSTREAM
          script: |
            set -e

            # Find the Caddyfile by asking Docker where the running Caddy has it
            # mounted, rather than guessing a path on someone else's filesystem.
            CADDY=$(docker ps --filter "name=caddy" --format '{{.Names}}' | head -1)
            [ -n "$CADDY" ] || { echo "No running caddy container found"; exit 1; }
            SRC=$(docker inspect "$CADDY" \
              --format '{{range .Mounts}}{{if eq .Destination "/etc/caddy/Caddyfile"}}{{.Source}}{{end}}{{end}}')
            [ -n "$SRC" ] || { echo "Caddy container $CADDY has no /etc/caddy/Caddyfile mount"; exit 1; }
            echo "Caddy container: $CADDY"
            echo "Caddyfile on host: $SRC"

            echo "=== current Caddyfile ==="
            cat "$SRC"
            echo "=== end ==="

            if [ "$ACTION" = "inspect" ]; then
              echo "Inspect only, nothing changed."
              exit 0
            fi

            if grep -qE "^[[:space:]]*${HOSTNAME_IN}[[:space:],{]" "$SRC"; then
              echo "$HOSTNAME_IN already present, nothing to do."
              exit 0
            fi

            BACKUP="${SRC}.bak.$(date +%s)"
            cp "$SRC" "$BACKUP"
            echo "Backed up to $BACKUP"

            # printf rather than a heredoc: a heredoc body has to sit at column 0,
            # which would terminate this YAML block scalar.
            printf '\n%s {\n    reverse_proxy %s\n}\n' "$HOSTNAME_IN" "$UPSTREAM" >> "$SRC"

            # Validate inside the container, which is the binary that will load it.
            if ! docker exec "$CADDY" caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile; then
              echo "Validation FAILED, restoring backup."
              cp "$BACKUP" "$SRC"
              exit 1
            fi

            docker exec "$CADDY" caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile
            echo "Reloaded. $HOSTNAME_IN -> $UPSTREAM"
