name: Deploy

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      reason:
        description: "Deploy reason (for the audit trail)"
        required: true

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU (multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Image name derives from the repository (lowercased — required by GHCR),
      # so forks publish to their own namespace with zero config.
      - name: Compute image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY@L}" >> "$GITHUB_ENV"

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

  # Self-hoster-specific half: SSHs into the maintainer's server. Forks get the
  # build-and-push job out of the box; to enable deploys, set the repository
  # variable DEPLOY_ENABLED=true and the VM_HOST / VM_USER / VM_SSH_KEY secrets.
  deploy:
    needs: build-and-push
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    steps:
      - name: Deploy to VM
        uses: appleboy/ssh-action@v1
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          key: ${{ secrets.VM_SSH_KEY }}
          envs: GHCR_TOKEN
          script: |
            set -Eeuo pipefail
            cd /opt/pulso
            # Self-healing VM state: force GITHUB_OWNER to the deploying repo's owner
            # (the image is pushed to that namespace) and sync the compose file from
            # the exact sha being deployed — the VM never drifts from the repo.
            if grep -q '^GITHUB_OWNER=' .env; then
              sed -i 's/^GITHUB_OWNER=.*/GITHUB_OWNER=${{ github.repository_owner }}/' .env
            else
              echo "GITHUB_OWNER=${{ github.repository_owner }}" >> .env
            fi
            curl -fsSL "https://raw.githubusercontent.com/${{ github.repository }}/${{ github.sha }}/docker-compose.yml" -o docker-compose.yml
            echo "VM config: GITHUB_OWNER=$(grep '^GITHUB_OWNER=' .env | cut -d= -f2), compose synced from ${{ github.sha }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            candidate_image="ghcr.io/${{ github.repository }}:${{ github.sha }}"
            candidate_image="${candidate_image,,}"
            previous_container="$(docker compose --env-file .env ps -q app || true)"
            previous_image=""
            if [ -n "$previous_container" ]; then
              previous_image="$(docker inspect --format '{{.Config.Image}}' "$previous_container")"
            elif [ -f .last-successful-image ]; then
              previous_image="$(tr -d '\r\n' < .last-successful-image)"
            fi
            export PULSYR_IMAGE="$candidate_image"
            docker compose --env-file .env pull app
            docker compose --env-file .env up -d db
            for attempt in $(seq 1 30); do
              docker compose --env-file .env exec -T db pg_isready -U pulso && break
              [ "$attempt" -eq 30 ] && exit 1
              sleep 2
            done
            # Migrate with the new image before it receives production traffic.
            docker compose --env-file .env run --rm --no-deps app alembic upgrade head
            docker compose --env-file .env up -d --no-deps app
            healthy=false
            for attempt in $(seq 1 30); do
              if docker compose --env-file .env exec -T app python -c \
                "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"; then
                healthy=true
                break
              fi
              sleep 2
            done
            if [ "$healthy" != true ]; then
              echo "Candidate failed readiness; restoring previous application image"
              if [ -z "$previous_image" ]; then
                echo "No previous image is available for automatic rollback"
                exit 1
              fi
              export PULSYR_IMAGE="$previous_image"
              docker compose --env-file .env up -d --no-deps app
              rollback_healthy=false
              for attempt in $(seq 1 30); do
                if docker compose --env-file .env exec -T app python -c \
                  "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"; then
                  rollback_healthy=true
                  break
                fi
                sleep 2
              done
              [ "$rollback_healthy" = true ] || echo "CRITICAL: rollback image also failed readiness"
              exit 1
            fi
            printf '%s\n' "$candidate_image" > .last-successful-image
            echo "Deploy OK: ${{ github.sha }}"
