name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pulsyr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pulsyr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pulsyr:test@localhost:5432/pulsyr_test
      SECRET_KEY: test-secret
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (locked runtime + dev extras)
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      # CI-2 / DM-06: validates that migrations apply AND revert (round-trip).
      # env.py reads DATABASE_URL (async URL); Alembic's async engine uses it directly.
      # upgrade head → downgrade base → upgrade head: catches broken or non-idempotent
      # downgrades before they reach production. Runs BEFORE pytest (which uses
      # create_all, not migrations) and leaves the DB migrated for eventual inspection.
      - name: Alembic migrations (round-trip)
        env:
          DATABASE_URL: postgresql+asyncpg://pulsyr:test@localhost:5432/pulsyr_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests + coverage
        run: >-
          pytest tests/ -v --tb=short
          --cov=app --cov-report=term-missing --cov-fail-under=90

  public-site:
    name: Public site
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build versioned private-app assets
        working-directory: site
        run: npm run build:app

      - name: Verify generated assets are committed
        run: git diff --exit-code -- app/static/assets app/static/asset-manifest.json

      - name: Validate documented Caddy policy
        run: >-
          docker run --rm
          -v "$PWD/infra/Caddyfile.example:/etc/caddy/Caddyfile:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

      - name: Type and content checks
        working-directory: site
        run: npm run check

      - name: Static build
        working-directory: site
        run: npm run build

      - name: Enforce performance budgets
        working-directory: site
        run: npm run check:budget

      - name: Validate generated public surface
        run: python scripts/check_public_site.py site/dist

      - name: Confirm analytics is disabled outside production configuration
        run: python scripts/check_analytics_build.py site/dist

      - name: Validate production-only analytics contract
        working-directory: site
        env:
          PUBLIC_ANALYTICS_ENABLED: "true"
          PUBLIC_DEPLOYMENT_ENVIRONMENT: production
        run: npm run build

      - name: Confirm one analytics snippet and the event catalog
        run: python scripts/check_analytics_build.py site/dist --enabled

      - name: Restore dependency-free default build for browser tests
        working-directory: site
        run: npm run build

      - name: Reconfirm default analytics exclusion
        run: python scripts/check_analytics_build.py site/dist

      - name: Install Playwright Chromium
        working-directory: site
        run: npx playwright install --with-deps chromium

      - name: Accessibility, responsive and browser smoke tests
        working-directory: site
        run: npm run test:e2e

      - name: Upload browser-test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-site-playwright-report
          path: site/playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --no-deps --disable-pip

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Audit locked frontend dependencies
        working-directory: site
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build inspection-only image
        run: docker build --tag pulsyr-ci:${{ github.sha }} .

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pulsyr-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX image SBOM
        if: always()
        uses: aquasecurity/trivy-action@0.36.0
        with:
          image-ref: pulsyr-ci:${{ github.sha }}
          format: cyclonedx
          output: trivy-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsyr-image-sbom
          path: trivy-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
