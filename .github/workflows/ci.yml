name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pulsyr
          POSTGRES_PASSWORD: test
          POSTGRES_DB: pulsyr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pulsyr"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+asyncpg://pulsyr:test@localhost:5432/pulsyr_test
      SECRET_KEY: test-secret
      DEBUG: "true"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies (locked runtime + dev extras)
        run: |
          pip install -r requirements.lock
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check .

      - name: Type check (mypy)
        run: mypy app/ --ignore-missing-imports

      # CI-2 / DM-06: validates that migrations apply AND revert (round-trip).
      # env.py reads DATABASE_URL (async URL); Alembic's async engine uses it directly.
      # upgrade head → downgrade base → upgrade head: catches broken or non-idempotent
      # downgrades before they reach production. Runs BEFORE pytest (which uses
      # create_all, not migrations) and leaves the DB migrated for eventual inspection.
      - name: Alembic migrations (round-trip)
        env:
          DATABASE_URL: postgresql+asyncpg://pulsyr:test@localhost:5432/pulsyr_test
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Tests + coverage
        run: >-
          pytest tests/ -v --tb=short
          --cov=app --cov-report=term-missing --cov-fail-under=90

  public-build:
    name: Public build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies
        working-directory: site
        run: npm ci

      - name: Build versioned private-app assets
        working-directory: site
        run: npm run build:app

      - name: Verify generated assets are committed
        run: git diff --exit-code -- app/static/assets app/static/asset-manifest.json

      - name: Type and content checks
        working-directory: site
        run: npm run check

      - name: Static build
        working-directory: site
        run: npm run build

      - name: Enforce performance budgets
        working-directory: site
        run: npm run check:budget

      - name: Confirm analytics is disabled outside production configuration
        run: python scripts/check_analytics_build.py site/dist

      - name: Validate production-only analytics contract
        working-directory: site
        env:
          PUBLIC_ANALYTICS_ENABLED: "true"
          PUBLIC_DEPLOYMENT_ENVIRONMENT: production
        run: npm run build

      - name: Confirm one analytics snippet and the event catalog
        run: python scripts/check_analytics_build.py site/dist --enabled

      - name: Restore dependency-free default build
        working-directory: site
        run: npm run build

      - name: Reconfirm default analytics exclusion
        run: python scripts/check_analytics_build.py site/dist

      - name: Validate temporary gate exceptions
        run: python scripts/check_quality_exceptions.py docs/quality-gate-exceptions.json

      - name: Upload reusable static build
        uses: actions/upload-artifact@v4
        with:
          name: public-site-dist
          path: site/dist/
          if-no-files-found: error
          retention-days: 7

  seo-crawl:
    name: SEO crawl
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Enforce metadata, indexation, sitemap and internal-link contract
        run: >-
          python scripts/check_public_site.py site/dist
          --report artifacts/seo/report.json
      - name: Upload SEO crawl evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-crawl-report
          path: artifacts/seo/
          if-no-files-found: error
          retention-days: 30

  html-validation:
    name: HTML validation
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Install locked validator
        working-directory: site
        run: npm ci
      - name: Validate generated HTML
        working-directory: site
        run: |
          mkdir -p artifacts/html
          set +e
          npm run check:html -- --formatter json > artifacts/html/report.json
          status=$?
          set -e
          cat artifacts/html/report.json
          exit "$status"
      - name: Upload HTML validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: html-validation-report
          path: site/artifacts/html/
          if-no-files-found: error
          retention-days: 30

  browser-quality:
    name: Browser and axe
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Install locked browser tooling
        working-directory: site
        run: npm ci
      - name: Install Chromium, Firefox and WebKit
        working-directory: site
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Chromium accessibility, responsive and console gate
        working-directory: site
        env:
          PLAYWRIGHT_REPORT_NAME: chromium-quality
        run: npm run test:e2e
      - name: Cross-browser smoke gate
        working-directory: site
        env:
          FULL_BROWSER_MATRIX: "true"
          PLAYWRIGHT_REPORT_NAME: cross-browser
        run: npm run test:browsers
      - name: Upload browser and axe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-axe-report
          path: |
            site/artifacts/playwright/
            site/playwright-report/
            site/test-results/
          if-no-files-found: error
          retention-days: 30

  lighthouse:
    name: Lighthouse
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Install locked Lighthouse tooling
        working-directory: site
        run: npm ci
      - name: Audit representative public routes
        working-directory: site
        run: |
          mkdir -p artifacts/lighthouse
          npm run preview -- --host 127.0.0.1 --port 4321 > artifacts/lighthouse/server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            curl --fail --silent http://127.0.0.1:4321/ >/dev/null && break
            sleep 1
          done
          for item in "home:/" "product:/producto/" "docs:/docs/primeros-pasos/"; do
            name="${item%%:*}"
            route="${item#*:}"
            npx lighthouse "http://127.0.0.1:4321${route}" \
              --output=json \
              --output-path="artifacts/lighthouse/${name}.json" \
              --only-categories=performance,accessibility,best-practices,seo \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
              --quiet
          done
          npm run check:lighthouse
      - name: Upload Lighthouse evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: site/artifacts/lighthouse/
          if-no-files-found: error
          retention-days: 30

  delivery-contract:
    name: Headers, cache and compression
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Validate production Caddy configuration
        run: >-
          docker run --rm
          -v "$PWD/infra:/etc/caddy:ro"
          caddy:2.10.2-alpine
          caddy validate --config /etc/caddy/Caddyfile.example --adapter caddyfile
      - name: Exercise public delivery policy
        run: bash scripts/check_public_delivery.sh
      - name: Upload delivery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: delivery-contract-report
          path: artifacts/delivery/
          if-no-files-found: error
          retention-days: 30

  links:
    name: Link integrity
    needs: public-build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          name: public-site-dist
          path: site/dist
      - name: Check internal fragments and critical external journeys
        run: >-
          python scripts/check_site_links.py site/dist
          --critical site/critical-external-links.txt
          --report artifacts/links/report.json
      - name: Upload link-check evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: link-integrity-report
          path: artifacts/links/
          if-no-files-found: error
          retention-days: 30

  supply-chain:
    name: Supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Audit locked Python dependencies
        run: |
          python -m pip install pip-audit==2.10.1
          pip-audit -r requirements.lock --no-deps --disable-pip

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Audit locked frontend dependencies
        working-directory: site
        run: |
          npm ci
          npm audit --audit-level=high

      - name: Build inspection-only image
        run: docker build --tag pulsyr-ci:${{ github.sha }} .

      - name: Scan image for fixed high and critical vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulsyr-ci:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: HIGH,CRITICAL

      - name: Generate CycloneDX image SBOM
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: pulsyr-ci:${{ github.sha }}
          format: cyclonedx
          output: trivy-sbom.cdx.json
          exit-code: "0"

      - name: Upload SBOM evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pulsyr-image-sbom
          path: trivy-sbom.cdx.json
          if-no-files-found: error
          retention-days: 30
