services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    volumes:
      - pulso_db:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: pulso
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: pulso
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pulso"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build: .
    image: ${PULSYR_IMAGE:-ghcr.io/${GITHUB_OWNER:-your-username}/pulsyr:${IMAGE_TAG:-latest}}
    restart: unless-stopped
    stop_grace_period: 45s
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://pulso:${DB_PASSWORD}@db/pulso
    ports:
      - "${PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  pulso_db:
