{# Accessible disclosure menu with a real-link fallback. Context: `entry`, `navigation`. #}
<div class="p-menu h-16 flex items-center" data-nav-menu>
  <a href="{{ entry.href }}"
     class="p-navlink flex items-center gap-1 {% if navigation.active_key == entry.key %}p-navlink-active{% endif %}"
     data-nav-menu-trigger aria-haspopup="menu" aria-expanded="false"
     {% if navigation.active_key == entry.key %}aria-current="page"{% endif %}>
    {{ t(entry.label_key) }}
    <svg class="w-3 h-3" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true"><path stroke-linecap="round" d="M6 9l6 6 6-6"/></svg>
  </a>
  <div class="p-menu-panel left-0 right-auto hidden" data-nav-menu-panel role="menu">
    {% for child in entry.children %}
    <a href="{{ child.href }}" role="menuitem"
       class="p-menu-item {% if navigation.active_child_key == child.key %}bg-surface-strong text-ink font-semibold{% endif %}"
       {% if navigation.active_child_key == child.key %}aria-current="page"{% endif %}>
      {{ t(child.label_key) }}
    </a>
    {% endfor %}
  </div>
</div>
