<!doctype html>
<html lang="{{ current_lang() }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>{{ status_code }} — {{ heading }} — Pulsyr</title>
  <style>
    :root{color-scheme:light dark;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#fffaf0;color:#0a0a0a}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.5rem;background:#fffaf0;color:#353530}
    main{width:min(680px,100%);padding:clamp(2rem,6vw,4.5rem);border:1px solid #ded8c9;border-radius:24px;background:#faf5e8;box-shadow:0 22px 70px rgb(35 28 15 / 12%)}
    .code{color:#9b1c52;font-size:.78rem;font-weight:800;letter-spacing:.12em;text-transform:uppercase}h1{margin:.5rem 0 1rem;color:#0a0a0a;font-size:clamp(2.4rem,8vw,4.8rem);line-height:1;letter-spacing:-.05em}p{line-height:1.65}.actions{display:flex;flex-wrap:wrap;gap:.75rem;margin-top:1.7rem}a{display:inline-flex;min-height:44px;align-items:center;padding:.7rem 1rem;border:1px solid #0a0a0a;border-radius:10px;color:#0a0a0a;font-weight:700;text-decoration:none}a:first-child{background:#0a0a0a;color:#fff}.request{margin-top:2rem;color:#686459;font:500 .76rem ui-monospace,monospace;overflow-wrap:anywhere}
    @media(prefers-color-scheme:dark){:root,body{background:#141411;color:#d9d5c8}main{background:#1d1c18;border-color:#39372f}h1{color:#fffaf0}a{border-color:#fffaf0;color:#fffaf0}a:first-child{background:#fffaf0;color:#0a0a0a}}
  </style>
</head>
<body>
  <main>
    <p class="code">{{ status_code }} · Pulsyr</p>
    <h1>{{ heading }}</h1>
    <p>{{ message }}</p>
    <div class="actions"><a href="/">Return to Pulsyr</a><a href="https://pulsyr.dev/docs/primeros-pasos/">Public documentation</a></div>
    <p class="request">Request ID: {{ request_id }}</p>
  </main>
</body>
</html>
